<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14120F">
<meta name="description" content="Novità e classifiche di film e serie TV, con voti e disponibilità streaming in Italia.">
<title>Cinema Pulse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="shell">
  <header class="top">
    <button class="logo" data-go="home" aria-label="Vai alla home">
      <span class="lamp"></span>
      <span class="wordmark">Cinema<i>Pulse</i></span>
    </button>
    <div class="sync">
      <span class="sync-when" id="syncWhen"></span>
      <button class="sync-btn" id="syncBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        Aggiorna
      </button>
    </div>
  </header>

  <main>
    <section id="v-home" class="view on"></section>
    <section id="v-chart" class="view"></section>
    <section id="v-find" class="view"></section>
    <section id="v-mine" class="view"></section>
    <section id="v-prefs" class="view"></section>
    <section id="v-sheet" class="view"></section>
  </main>
</div>

<nav class="nav" aria-label="Sezioni">
  <button class="nav-i on" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>Home<i class="dotmark"></i></button>
  <button class="nav-i" data-go="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6.5 19V11"/><path d="M12 19V5"/><path d="M17.5 19v-5.5"/></svg>Classifica<i class="dotmark"></i></button>
  <button class="nav-i" data-go="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Cerca<i class="dotmark"></i></button>
  <button class="nav-i" data-go="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v17l-6-4.2L6 21z"/></svg>La mia lista<i class="dotmark"></i></button>
  <button class="nav-i" data-go="prefs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Impostazioni<i class="dotmark"></i></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
